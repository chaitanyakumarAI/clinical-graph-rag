# One-command setup:   cp .env.example .env   (add a password + one LLM key)
#                      docker compose up --build
# UI  → http://localhost:8080     API docs → http://localhost:8000/docs
# Neo4j browser → http://localhost:7474
name: medical-graph-rag

services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}
      # Optional: NEO4J_PLUGINS='["graph-data-science"]' in .env enables the
      # GDS route (shortest path / similarity / PageRank). The app works without it.
      NEO4J_PLUGINS: ${NEO4J_PLUGINS:-[]}
      NEO4J_dbms_security_procedures_unrestricted: gds.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p '${NEO4J_PASSWORD}' 'RETURN 1'"]
      interval: 10s
      timeout: 10s
      retries: 30

  qdrant:
    image: qdrant/qdrant:v1.20.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant-data:/qdrant/storage

  backend:
    build: .
    env_file: .env
    environment:
      # Container-to-container addresses override whatever .env says for local runs.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      QDRANT_URL: http://qdrant:6333
      # Lets LLM_PROVIDER=ollama reach an Ollama running on the host machine.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - hf-models:/models          # embedding + reranker models (~3 GB, downloaded once)
      - extraction-cache:/app/.cache   # per-chunk LLM cache, so re-ingestion is free
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  neo4j-data:
  qdrant-data:
  hf-models:
  extraction-cache:

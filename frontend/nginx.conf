# The React app calls the API with relative URLs (const API = ''), so nginx
# serves the static build and forwards API paths to the backend container —
# the same job the Vite dev-server proxy does in development.
server {
    listen 80;
    root /usr/share/nginx/html;

    # PDF uploads
    client_max_body_size 100m;

    location ~ ^/(query|ingest|documents|graph|health|docs|openapi\.json) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Ingesting a long PDF on a rate-limited free tier can take many minutes.
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
